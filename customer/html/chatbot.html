<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asisten Chatbot – LayarTix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       CHATBOT FULL LAYAR (100dvh/100vh) - TEMA GELAP MARUN-EMAS HIDUP
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      --bg-deepest: #0c0407;
      --bg-primary: #120609;
      --bg-dark: #1d090f;
      --bg-accent: #2a0d16;
      --bg-glass: rgba(26, 8, 14, 0.78);
      --gold: #f5c242;
      --gold-light: #ffe48a;
      --gold-dim: rgba(245, 194, 66, 0.12);
      --gold-border: rgba(245, 194, 66, 0.28);
      --maroon: #6b0c2c;
      --maroon-bright: #a01040;
      --maroon-velvet: #8a0c34;
      --text-primary: #f8f4eb;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --text-muted: rgba(255, 255, 255, 0.46);
      --online-green: #22c55e;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100dvh;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-deepest);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Layered Background: Spotlight Marun Hangat & Kilau Emas Hidup ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 65% 55% at 15% 12%, rgba(138, 12, 52, 0.32), transparent 70%),
        radial-gradient(ellipse 55% 60% at 85% 88%, rgba(245, 194, 66, 0.12), transparent 75%),
        radial-gradient(ellipse 75% 65% at 50% 50%, rgba(42, 13, 22, 0.45), transparent);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle 320px at 10% 85%, rgba(245, 194, 66, 0.08), transparent),
        radial-gradient(circle 260px at 92% 18%, rgba(160, 16, 64, 0.16), transparent);
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════════════════════
       HEADER GLASSMORPHISM MARUN GELAP
       ══════════════════════════════════════════════════════════════════════ */
    .chat-header {
      flex: 0 0 auto;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border-bottom: 1px solid var(--gold-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }
    .btn-back:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateX(-2px);
    }
    .btn-back svg {
      width: 16px;
      height: 16px;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, #c98e1e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: #17050a;
      box-shadow: 0 0 16px rgba(245, 194, 66, 0.45);
      flex-shrink: 0;
      letter-spacing: -0.5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .header-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.25;
      letter-spacing: 0.02em;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-green);
      box-shadow: 0 0 10px var(--online-green);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.9); opacity: 0.75; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .btn-clear {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(245, 194, 66, 0.08);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-clear:hover {
      background: rgba(245, 194, 66, 0.18);
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(245, 194, 66, 0.25);
    }
    .btn-clear svg {
      width: 14px;
      height: 14px;
    }

    /* ══════════════════════════════════════════════════════════════════════
       BAR CHIP SARAN CEPAT
       ══════════════════════════════════════════════════════════════════════ */
    .chip-bar {
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
      display: flex;
      gap: 8px;
      padding: 10px 18px;
      overflow-x: auto;
      background: rgba(14, 5, 9, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      -webkit-overflow-scrolling: touch;
    }
    .chip-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      padding: 7px 15px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .chip:hover {
      background: rgba(245, 194, 66, 0.25);
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(245, 194, 66, 0.28);
      transform: translateY(-1px);
    }

    /* ══════════════════════════════════════════════════════════════════════
       AREA PESAN CHAT (AUTO-SCROLL & ANIMASI HALUS)
       ══════════════════════════════════════════════════════════════════════ */
    .chat-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .chat-body::-webkit-scrollbar {
      width: 5px;
    }
    .chat-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: rgba(245, 194, 66, 0.25);
      border-radius: 4px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 86%;
      opacity: 0;
      transform: translateY(14px);
      animation: msg-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes msg-in {
      to { opacity: 1; transform: none; }
    }

    .msg-row.bot {
      align-self: flex-start;
    }
    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, var(--maroon), var(--gold));
      border: 1px solid var(--gold-border);
      box-shadow: 0 0 10px rgba(245, 194, 66, 0.22);
    }
    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, var(--maroon-bright), var(--maroon-velvet));
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .msg-bubble {
      padding: 13px 18px;
      font-size: 13.5px;
      line-height: 1.6;
      border-radius: 18px;
      word-break: break-word;
      position: relative;
    }

    .msg-row.bot .msg-bubble {
      background: rgba(29, 9, 15, 0.88);
      border: 1px solid var(--gold-border);
      border-left: 4px solid var(--gold);
      border-top-left-radius: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 18px rgba(245, 194, 66, 0.05);
      color: var(--text-primary);
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, var(--maroon-velvet) 0%, #580824 100%);
      border: 1px solid rgba(245, 194, 66, 0.35);
      border-top-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(138, 12, 52, 0.45), 0 0 16px rgba(245, 194, 66, 0.12);
      color: #ffffff;
      font-weight: 500;
    }

    .msg-bubble p {
      margin: 0 0 7px;
    }
    .msg-bubble p:last-child {
      margin-bottom: 0;
    }
    .msg-bubble strong {
      color: var(--gold);
    }
    .msg-bubble ul, .msg-bubble ol {
      margin: 5px 0 7px 22px;
      padding: 0;
    }
    .msg-bubble li {
      margin-bottom: 4px;
      font-size: 13px;
    }
    .msg-bubble code {
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--gold-light);
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: right;
    }
    .msg-row.bot .msg-time {
      text-align: left;
    }

    /* Typing Indicator Realistis */
    .typing-row {
      display: flex;
      gap: 12px;
      align-self: flex-start;
      max-width: 86%;
      animation: msg-in 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      background: rgba(29, 9, 15, 0.85);
      border: 1px solid var(--gold-border);
      border-left: 4px solid var(--gold);
      border-radius: 18px;
      border-top-left-radius: 4px;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ══════════════════════════════════════════════════════════════════════
       COMPOSER BAWAH MENEMPEL (FLEX-SHRINK: 0 & AUTO-RESIZE)
       ══════════════════════════════════════════════════════════════════════ */
    .chat-composer {
      flex: 0 0 auto;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 12px 18px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border-top: 1px solid var(--gold-border);
      box-shadow: 0 -6px 25px rgba(0, 0, 0, 0.4);
    }

    .composer-textarea {
      flex: 1;
      resize: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      padding: 11px 16px;
      border-radius: 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
      min-height: 44px;
      max-height: 130px;
      outline: none;
      transition: all 0.2s ease;
    }
    .composer-textarea:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 12px rgba(245, 194, 66, 0.25);
    }
    .composer-textarea::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .btn-send {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--gold) 0%, #d9a02b 100%);
      border: none;
      color: #17050a;
      padding: 12px 20px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(245, 194, 66, 0.38);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(245, 194, 66, 0.55);
    }
    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-send svg {
      width: 16px;
      height: 16px;
    }

    @media (min-width: 768px) {
      .chat-body { padding: 22px 30px; }
      .msg-row { max-width: 72%; }
      .msg-bubble { font-size: 14px; }
      .chat-composer { padding: 14px 28px; }
    }
  </style>
</head>

<body>

  <!-- ═════════════════ HEADER ATAS ═════════════════ -->
  <header class="chat-header">
    <div class="header-left">
      <button class="btn-back" id="btnBack" title="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Kembali</span>
      </button>
    </div>

    <div class="header-center">
      <div class="avatar-badge">LT</div>
      <div class="header-title-wrap">
        <div class="header-title">Asisten LayarTix</div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span>Online · Siaga 24/7</span>
        </div>
      </div>
    </div>

    <button class="btn-clear" id="btnClear" title="Bersihkan riwayat percakapan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Bersihkan</span>
    </button>
  </header>

  <!-- ═════════════════ BAR CHIP SARAN CEPAT ═════════════════ -->
  <div class="chip-bar" id="chipBar"></div>

  <!-- ═════════════════ AREA PESAN CHAT ═════════════════ -->
  <main class="chat-body" id="chatBody"></main>

  <!-- ═════════════════ COMPOSER INPUT BAWAH ═════════════════ -->
  <footer class="chat-composer">
    <textarea class="composer-textarea" id="txtInput"
      placeholder="Ketik pertanyaan Anda tentang LayarTix..." rows="1"></textarea>
    <button class="btn-send" id="btnSend" disabled title="Kirim pesan">
      <span>Kirim</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </footer>

  <!-- ═════════════════ DATA LAYER (UNTUK DATA STATE BIOSKOP & KOTA) ═════════════════ -->
  <script src="../../data.js"></script>

  <!-- ═════════════════ LOGIKA CHATBOT TERPADU (EKSTERNAL DI CUSTOMER/JS/CHATBOT.JS) ═════════════════ -->
  <script src="../js/chatbot.js"></script>
</body>

</html>
