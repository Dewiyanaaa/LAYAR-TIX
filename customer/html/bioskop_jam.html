<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Bioskop – LayarTix</title>
  <link rel="stylesheet" href="../css/beranda.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cinema-card {
      margin: 0 16px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.2s;
    }

    .cinema-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    @media (min-width: 768px) {
      .cinema-card {
        margin: 0;
      }
    }

    /* Search Mall Box */
    .cinema-search-wrapper {
      padding: 12px 16px 4px;
    }

    .cinema-search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0 12px;
      transition: all 0.25s ease;
    }

    .cinema-search-box:focus-within {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .cinema-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 10px 0;
    }

    .cinema-search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .cinema-search-clear {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .cinema-search-clear:hover {
      background: rgba(230, 57, 70, 0.8);
    }

    .cinema-empty-search {
      padding: 36px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin: 12px 16px;
    }

    .cinema-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .cinema-name {
      font-size: 15px;
      font-weight: 700;
    }

    .cinema-mall {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .cinema-facilities {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .facility-tag {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .cinema-times {
      padding: 12px 16px;
    }

    .times-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .time-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .time-pill {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .time-pill:hover {
      background: rgba(230, 57, 70, 0.12);
      border-color: rgba(230, 57, 70, 0.3);
      color: var(--red);
    }

    .time-pill.selected {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .time-pill.almost-full {
      border-color: rgba(245, 158, 11, 0.4);
      color: #f59e0b;
    }

    .date-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
      margin-bottom: 16px;
    }

    .date-tabs::-webkit-scrollbar {
      display: none;
    }

    .date-tab {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      min-width: 60px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .date-tab.active {
      background: rgba(230, 57, 70, 0.12);
      border-color: rgba(230, 57, 70, 0.3);
      color: var(--red);
    }

    .date-day {
      font-size: 16px;
      font-weight: 700;
    }

    .date-mon {
      font-size: 10px;
    }

    .seat-type-tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .seat-type-tab {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .seat-type-tab.active {
      background: rgba(255, 215, 0, 0.1);
      border-color: rgba(255, 215, 0, 0.25);
      color: var(--gold);
    }

    /* Age warning */
    .age-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .age-modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .age-modal {
      background: var(--dark2);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 2px solid;
      animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      from {
        transform: scale(0.7);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .age-icon {
      font-size: 72px;
      margin-bottom: 12px;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.08)
      }
    }

    .age-badge {
      font-size: 48px;
      font-weight: 900;
      font-family: 'Cinzel', serif;
      margin-bottom: 8px;
    }

    .age-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .age-text {
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .age-actions {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div class="app-frame">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-container">
      <div style="display:flex;align-items:center;gap:12px">
        <button type="button" class="btn-nav-back" onclick="handleSmartBack('beranda.html')" title="Kembali ke Beranda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Kembali</span>
        </button>
        <div class="header-logo" onclick="window.location.href='beranda.html'">LAYARTIX</div>
        <nav class="desktop-nav">
          <a href="beranda.html" class="desktop-nav-link ">LayarTix Beranda</a>
          <a href="fnb.html" class="desktop-nav-link ">LayarTix Kantin F&amp;B</a>
          <a href="tiket.html" class="desktop-nav-link ">Tiket Anda</a>
          <a href="akun.html" class="desktop-nav-link ">Akun</a>
        </nav>
      </div>

      <div style="display:flex;align-items:center;gap:10px">
        <a id="adminHeaderLink" href="../../admin/html/dashboard.html" style="display:none"
          class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 transition-all">
           Admin
        </a>
      </div>
    </div>
  </header>

    <div class="page-content page-enter">

      <!-- Movie mini info -->
      <div
        style="padding:16px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center"
        id="movieMiniInfo">
      </div>

      <!-- ULASAN PER FILM & SPOILER PROTECTION (Tampil tepat sebelum memilih mall/bioskop & jam nonton) -->
      <section class="movie-reviews-wrapper" id="movieReviewsSection">
        <div class="reviews-header-card">
          <div class="reviews-summary-left">
            <div class="reviews-rating-big">
              <span id="avgRatingDisplay" class="avg-rating-val">5.0</span>
              <div class="rating-stars-badge" id="avgStarsDisplay">★★★★★</div>
            </div>
            <div class="reviews-count-meta">
              <div class="reviews-count-title">Ulasan Penonton Film Ini</div>
              <div class="reviews-count-sub" id="reviewsCountDisplay">Memuat ulasan penonton...</div>
            </div>
          </div>
          <button type="button" class="btn-toggle-write-review" id="btnToggleWriteReview" onclick="toggleReviewForm()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Tulis Ulasan</span>
          </button>
        </div>

        <!-- Form Tulis Ulasan Baru -->
        <div class="review-form-container" id="reviewFormContainer" style="display:none">
          <div class="review-form-header">
            <div class="review-form-title">Tulis Ulasan untuk Film Ini</div>
            <button type="button" class="btn-close-form" onclick="toggleReviewForm(false)" title="Tutup Form">&times;</button>
          </div>

          <div class="review-form-group">
            <label class="review-form-label" for="reviewerNameInput">Nama Pengulas (Opsional):</label>
            <input type="text" id="reviewerNameInput" class="review-input-text" placeholder="Nama Anda (cth: Alex / Penonton LayarTix)" maxlength="40" autocomplete="off" />
          </div>

          <div class="review-form-group">
            <label class="review-form-label">Rating Bintang (Wajib):</label>
            <div class="interactive-star-picker" id="interactiveStarPicker">
              <button type="button" class="star-pick-btn" data-star="1" onclick="selectFormStar(1)" title="1 Bintang">★</button>
              <button type="button" class="star-pick-btn" data-star="2" onclick="selectFormStar(2)" title="2 Bintang">★</button>
              <button type="button" class="star-pick-btn" data-star="3" onclick="selectFormStar(3)" title="3 Bintang">★</button>
              <button type="button" class="star-pick-btn" data-star="4" onclick="selectFormStar(4)" title="4 Bintang">★</button>
              <button type="button" class="star-pick-btn" data-star="5" onclick="selectFormStar(5)" title="5 Bintang">★</button>
              <span class="star-pick-label" id="starPickLabel">Pilih bintang (1–5)</span>
            </div>
          </div>

          <div class="review-form-group">
            <label class="review-form-label" for="reviewContentInput">Teks Ulasan Anda (Wajib):</label>
            <textarea id="reviewContentInput" class="review-textarea" rows="3" placeholder="Bagikan kesan, kualitas gambar/audio, alur cerita, atau akting aktor di film ini..."></textarea>
          </div>

          <div class="review-form-group review-spoiler-checkbox-wrap">
            <label class="spoiler-checkbox-label" for="reviewSpoilerCheckbox">
              <input type="checkbox" id="reviewSpoilerCheckbox" class="spoiler-custom-checkbox" />
              <span class="spoiler-label-text">
                <span class="shield-icon">🛡️</span> Ulasan mengandung <strong>Spoiler</strong> (Akan disembunyikan/di-blur dengan Spoiler Protection Shield)
              </span>
            </label>
          </div>

          <div class="review-form-actions">
            <button type="button" class="btn btn-outline btn-sm" style="padding:6px 14px;font-size:12px" onclick="toggleReviewForm(false)">Batal</button>
            <button type="button" class="btn-submit-review" onclick="submitMovieReview()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:4px">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              Kirim Ulasan
            </button>
          </div>
        </div>

        <!-- Daftar Ulasan Film -->
        <div class="reviews-list-container" id="movieReviewsList">
          <!-- Rendered dynamically by JavaScript -->
        </div>
      </section>

      <!-- City badge -->
      <div style="padding:12px 16px;display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)"> Menampilkan bioskop di</span>
        <button onclick="window.location.href='beranda.html'"
          style="font-size:12px;font-weight:700;color:var(--gold);background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:'Inter',sans-serif"
          id="cityDisplay">Pilih Kota</button>
      </div>

      <!-- Date selector -->
      <div class="date-tabs" id="dateTabs"></div>

      <!-- Seat type -->
      <div class="seat-type-tabs">
        <button class="seat-type-tab active" id="st-Regular" onclick="setSeatType('Regular',this)"> Regular</button>
        <button class="seat-type-tab" id="st-Premium" onclick="setSeatType('Premium',this)"> Premium</button>
        <button class="seat-type-tab" id="st-IMAX" onclick="setSeatType('IMAX',this)"> IMAX</button>
      </div>

      <!-- Live Search Mall / Bioskop -->
      <div class="cinema-search-wrapper">
        <div class="cinema-search-box">
          <svg style="width:16px;height:16px;color:var(--gold);margin-right:8px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="cinemaSearchInput" class="cinema-search-input"
                 placeholder="Cari nama mall atau bioskop yang menayangkan film ini..." autocomplete="off" />
          <button type="button" id="cinemaSearchClearBtn" class="cinema-search-clear" onclick="clearCinemaSearch()" title="Hapus pencarian">&times;</button>
        </div>
      </div>

      <!-- Cinemas list -->
      <div id="cinemasList" class="md:grid md:grid-cols-2 md:gap-5 md:px-4"></div>

      <div style="height:16px"></div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a class="nav-tab " href="beranda.html" title="Beranda">
        <div class="nav-icon-wrap">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
      </a>
      <a class="nav-tab " href="fnb.html" title="Kantin F&B">
        <div class="nav-icon-wrap">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
      </a>
      <a class="nav-tab " href="tiket.html" title="Tiket & Riwayat">
        <div class="nav-icon-wrap">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <path d="M13 12h.01"></path>
            <path d="M2 10a2 2 0 0 0 0 4"></path>
            <path d="M22 10a2 2 0 0 1 0 4"></path>
          </svg>
        </div>
      </a>
      <a class="nav-tab " href="akun.html" title="Profil Akun">
        <div class="nav-icon-wrap">
          <div class="nav-tab-avatar-wrap">
            <img class="user-avatar-img" src="" alt="Avatar" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;" />
            <svg class="user-avatar-svg w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>
      </a>
    </nav>
  </div>
</div>

<!-- AGE WARNING MODAL -->
<div class="age-modal-overlay" id="ageModal">
  <div class="age-modal" id="ageModalBox">
    <div class="age-icon"></div>
    <div class="age-badge" id="ageBadge">17+</div>
    <div class="age-title" id="ageTitle">BATAS USIA 17+</div>
    <div class="age-text" id="ageText">Film ini hanya untuk penonton berusia 17 tahun ke atas.</div>
    <div class="age-actions">
      <button class="btn btn-primary" style="padding:14px;font-size:15px;border-radius:14px;width:100%" onclick="confirmAge()">
         Saya Memenuhi Syarat – Lanjutkan
      </button>
      <button class="btn btn-outline" style="padding:12px;font-size:14px;border-radius:14px;width:100%" onclick="closeAgeModal()">
        Kembali
      </button>
    </div>
  </div>

  <script src="../../data.js"></script>
  <script src="../js/bioskop_jam.js"></script>
</body>

</html>
